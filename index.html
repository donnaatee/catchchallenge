<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catch Challenge</title>
<style>
:root{--ink:#7a3550;--ink2:#a5586f;--card:#fffafb;--line:#f6b6c7;--pink:#ff8fab;--pink2:#ffb3c6;--blue:#8fa5e6;--blue2:#c3d0f8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 18% 8%,#fff4f7 0,#ffe3ea 42%,#ffd1df 100%) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(#fff 2px,transparent 2.5px);background-size:46px 46px;background-position:0 0}
#app{position:relative;min-height:100vh;display:flex;gap:30px;align-items:center;justify-content:center;padding:18px;flex-wrap:wrap}
#stage{display:flex;flex-direction:column;align-items:center;gap:10px}
#machine{position:relative;width:390px;height:497px;touch-action:none;user-select:none;-webkit-user-select:none;
  border-radius:18px;box-shadow:0 18px 44px rgba(214,90,120,.38);cursor:default}
#bg,#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#bg{pointer-events:none;border-radius:18px}
#peek{position:absolute;display:none;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--line);color:var(--ink);
  font-size:12px;font-weight:700;padding:5px 9px;border-radius:12px;max-width:190px;text-align:center;pointer-events:none;box-shadow:0 4px 10px rgba(214,90,120,.25)}
#status{min-height:44px;max-width:430px;text-align:center;font-weight:700;font-size:15px;line-height:1.35;padding:9px 16px;
  background:rgba(255,255,255,.75);border:2px solid var(--line);border-radius:16px;color:var(--ink)}
#side{width:330px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(214,90,120,.15)}
.card h2{margin:0 0 10px;font-size:16px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:700;color:var(--ink2);font-size:13px}
#tray{display:flex;gap:8px;justify-content:space-between}
.coin{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:17px;color:#a8741a;
  background:radial-gradient(circle at 35% 30%,#fff6c2 0,#ffd75e 45%,#f5b92f 100%);border:3px solid #e0a124;box-shadow:inset 0 -3px 0 rgba(180,110,10,.25),0 3px 6px rgba(200,130,20,.3);transition:.25s}
.coin.spent{filter:grayscale(1);opacity:.22;box-shadow:none;border-style:dashed}
.flycoin{position:fixed;z-index:50;pointer-events:none;margin:0}
.how{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55;color:var(--ink2)}
.how b{color:var(--ink)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font:inherit;font-size:12.5px;font-weight:800;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.pill.on{background:linear-gradient(#ffc2d2,#ff9db6);border-color:#f58aa6;color:#fff;text-shadow:0 1px 0 rgba(160,50,80,.35)}
#list{display:flex;flex-direction:column;gap:9px;max-height:300px;overflow:auto;padding:2px}
.empty{font-size:13.5px;color:var(--ink2);text-align:center;padding:10px 4px}
.catch{display:flex;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.catch:hover{border-color:#ee8aa6;transform:translateY(-1px)}
.catch img{width:46px;height:46px;flex:none;image-rendering:pixelated}
.catch .t{font-weight:800;font-size:13.5px;line-height:1.25}
.catch .s{font-size:12px;color:var(--ink2);margin-top:2px;font-weight:700}
.catch.done{background:#f2fbf4;border-color:#a8dcb4}
.catch.done .t{text-decoration:line-through;text-decoration-color:#7cc78f;opacity:.75}
.linkbtn{font:inherit;font-size:12px;font-weight:700;color:var(--ink2);background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px;align-self:center}
#modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(122,53,80,.38);backdrop-filter:blur(3px);padding:16px}
#modal.open{display:flex}
#sheet{position:relative;width:min(100%,410px);background:var(--card);border:3px solid var(--line);border-radius:26px;padding:70px 22px 20px;text-align:center;
  box-shadow:0 24px 60px rgba(122,53,80,.4);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#sheet .pl{image-rendering:pixelated;position:absolute;left:50%;top:-58px;transform:translateX(-50%);width:130px;height:130px;filter:drop-shadow(0 8px 8px rgba(214,90,120,.35));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(-6px) rotate(2deg)}}
#sheet .kick{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.4px;text-transform:uppercase}
#sheet .ch{font-size:22px;font-weight:900;line-height:1.25;margin:6px 0 4px}
#sheet .sub{font-size:13px;color:var(--ink2);min-height:18px}
.ringwrap{position:relative;width:150px;height:150px;margin:12px auto 4px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .tm{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:900;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:15px;border-radius:999px;padding:11px 22px;cursor:pointer;border:3px solid #f28aa7;color:#fff;
  background:linear-gradient(#ffb0c6,#ff86a8);text-shadow:0 1px 0 rgba(160,50,80,.4);box-shadow:0 4px 0 #e56d90}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #e56d90}
.btn.alt{background:#fff;color:var(--ink);text-shadow:none;border-color:var(--line);box-shadow:0 4px 0 #f1cdd7}
.btn.good{background:linear-gradient(#9be3ad,#5fc980);border-color:#4eb36e;box-shadow:0 4px 0 #3f9c5b}
.btn:disabled{filter:grayscale(.7);opacity:.5;cursor:not-allowed;transform:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;z-index:60;background:#fff;border:2px solid var(--line);color:var(--ink);
  font-weight:800;font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 24px rgba(214,90,120,.35);transition:.3s;pointer-events:none;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

'use strict';
const $ = s => document.querySelector(s);
const W = 1115, H = 1410, START_COINS = 5, SC = W/390;
const FAST = new URLSearchParams(location.search).has('fast');   // ?fast=1 makes "minutes" last 3 seconds (for testing)
const SECS_PER_MIN = FAST ? 3 : 60;

/* ============================================================
   EDIT ME: the challenge pool.
   Each day the machine picks 6 of these (one per plushie).

   ============================================================ */
const CHALLENGES = [
  {id:'read',    emoji:'📖', text:'Read a book for 15 minutes', min:15},
  {id:'email',   emoji:'📧', text:'Clean out your email inbox'},
  {id:'meditate',emoji:'🧘', text:'Meditate for 10 minutes', min:10},
  {id:'journal', emoji:'✍️', text:'Write in journal', prompt:true},
  {id:'walk',    emoji:'🚶', text:'Take a 10-minute walk outside', min:10},
  {id:'stretch', emoji:'🤸', text:'Stretch for 5 minutes', min:5},
  {id:'desk',    emoji:'🧹', text:'Tidy your desk for 10 minutes', min:10},
  {id:'water',   emoji:'💧', text:'Drink a big glass of water'},
  {id:'friend',  emoji:'📞', text:'Text or call someone you haven\'t talked to in a while'},
  {id:'dance',   emoji:'💃', text:'Dance break: 5 minutes', min:5},
  {id:'learn',   emoji:'🎓', text:'Learn something new (tutorial or documentary) for 15 minutes', min:15},
  {id:'plan',    emoji:'📝', text:'Write down your top 3 priorities for tomorrow'},
  {id:'clean',   emoji:'🧺', text:'Deep-clean one small spot for 15 minutes', min:15},

const JOURNAL_PROMPTS = [
  'What made you smile this week?',
  'What is one thing you\'re proud of lately?',
  'Describe your ideal Saturday from start to finish.',

/* Plushie zones (artwork pixels): x0..x1 = claw positions that target it, top = top of the plushie in the pile */
const ZONES = [
  {name:'Strawberry Bunny', type:'pinkBunny', x0:215, x1:335, cx:275, top:545},
  {name:'Cloud Bunny',      type:'paleBunny', x0:335, x1:450, cx:392, top:650},
  {name:'Coral Bow',        type:'pigBow',    x0:450, x1:570, cx:510, top:665},
  {name:'Honey Bear',       type:'bear',      x0:570, x1:670, cx:620, top:655},
  {name:'Blush Bunny',      type:'pig',       x0:670, x1:745, cx:708, top:625},
  {name:'Cocoa Bear',       type:'bear2',     x0:745, x1:830, cx:788, top:565},
  {name:'Fluffy Bunny',     type:'bowBunny',  x0:830, x1:975, cx:900, top:555}
];

/* ---------------- persistence ---------------- */
const KEY = 'luckyCatch.v1', PKEY = 'luckyCatch.prefs';
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function newDay(seedExtra){
  const rnd = mulberry(hashStr(todayStr()+(seedExtra||'')));
  const idx = CHALLENGES.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return {date:todayStr(), coins:START_COINS, credit:false, assign: idx.slice(0,ZONES.length), won:[]};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){ S = null; }
if(S && S.date === todayStr() && Array.isArray(S.assign) && S.assign.length < ZONES.length){
  const unused = CHALLENGES.map((_,i)=>i).filter(i=>!S.assign.includes(i));
  while(S.assign.length < ZONES.length) S.assign.push(unused.splice(Math.floor(Math.random()*unused.length),1)[0]);
}
if(!S || S.date !== todayStr() || !Array.isArray(S.assign) || S.assign.length !== ZONES.length) S = newDay();

try { Object.assign(prefs, JSON.parse(localStorage.getItem(PKEY))||{}); } catch(e){}
prefs.peek = false;
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const savePrefs = () => { try{ localStorage.setItem(PKEY, JSON.stringify(prefs)); }catch(e){} };

/* ---------------- audio ---------------- */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, t0, dur, type, vol, slideTo){
  if(!prefs.sound) return; const a = ac(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||.07, t+.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const sfx = {
  coin(){ tone(1319,0,.09,'square',.04); tone(1760,.08,.28,'square',.04); },
  tick(){ tone(110,0,.035,'square',.012); },
  drop(){ tone(520,0,.55,'triangle',.05,200); },
  grab(){ tone(330,0,.1,'square',.04); tone(247,.09,.16,'square',.04); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.3,'triangle',.07)); },
  chime(){ for(let r=0;r<2;r++) [880,1175,1568].forEach((f,i)=>tone(f,r*.9+i*.18,.7,'sine',.08)); },
  nope(){ tone(220,0,.15,'sawtooth',.03); tone(180,.12,.2,'sawtooth',.03); },
  done(){ [659,784,988,1319].forEach((f,i)=>tone(f,i*.08,.25,'triangle',.06)); }
};

/* ---------------- plushie drawing ---------------- */
const PL = {
  pinkBunny:{body:'#fde8ea',line:'#c8636d',ear:'bunny',dots:1,eye:'#6b3a40'},
  bear2:    {body:'#c98a55',line:'#8a5530',ear:'bear', muzzle:'#e9c79a',eye:'#4a2a18'},
  bear:     {body:'#dba978',line:'#a2693a',ear:'bear', muzzle:'#f2d3ab',eye:'#5c3520'},
  paleBunny:{body:'#fff3f1',line:'#e59ba2',ear:'bunny',eye:'#6b3a40'},
  bowBunny: {body:'#ffffff',line:'#7aa3e6',ear:'lop',  bow:'#ee5a4d',bowLine:'#c2392f',eye:'#2f6fd6'},
  pigBow:   {body:'#fbd3d1',line:'#c8636d',ear:'pig',  snout:1,bow:'#f7a1ae',bowLine:'#c8636d',eye:'#6b3a40'},
  pig:      {body:'#fde1dc',line:'#c8636d',ear:'pig',  snout:1,cheek:1,eye:'#6b3a40'}

function plush(ctx, type, x, y, s, rot, noFace){
  const p = PL[type];
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); const u = s/52; ctx.scale(u,u);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

/* ---------------- toast ---------------- */
let toastT;

/* ---------------- coins ---------------- */
function insertCoin(){
  if(claw.phase !== 'idle') return;
  if(inserting) return;
  if(S.credit){ toast('You already have a credit. Press the red button!'); sfx.nope(); return; }
  if(S.coins <= 0){ toast('No coins left today. Fresh coins tomorrow! 🌙'); sfx.nope(); return; }
  inserting = true; S.coins--; save(); renderTray(true);
  const coins = [...document.querySelectorAll('#tray .coin')];
  const from = coins[S.coins].getBoundingClientRect(), mr = machine.getBoundingClientRect();
  const tx = mr.left + SLOT.x/W*mr.width, ty = mr.top + SLOT.y/H*mr.height;
  const fc = document.createElement('div'); fc.className = 'coin flycoin'; fc.textContent = '1';
  fc.style.left = from.left+'px'; fc.style.top = from.top+'px'; document.body.appendChild(fc);
  const dx = tx - (from.left+from.width/2), dy = ty - (from.top+from.height/2);
  const anim = fc.animate([{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${dx*.6}px,${dy-70}px) scale(1.15) rotate(200deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.45) rotate(360deg)`}],{duration:620,easing:'ease-in'});
  sfx.tick();
  anim.onfinish = () => { fc.remove(); S.credit = true; inserting = false; flash = 1; sfx.coin(); save(); renderTray(); setStatus(); };
}

/* ---------------- drop sequence ---------------- */
function pressButton(){
  if(claw.phase !== 'idle') return;
  if(!S.credit){ toast(S.coins>0 ? 'Insert a coin first! 🪙' : 'No coins left today. Fresh coins tomorrow! 🌙'); sfx.nope(); return; }
  const z = zoneAt(claw.x), zi = zoneIdx(z);
  if(caught(zi)){ toast(`You already caught ${z.name}. Line up another plushie!`); sfx.nope(); return; }
  claw.zone = zi; claw.phase = 'down'; claw.t = 0; claw.carry = null; joy.jx = 0;
  S.credit = false; save(); setStatus(); sfx.drop();
}

function finishCatch(){
  const zi = claw.zone, c = chOf(zi);
  const item = {zone:zi, cid:S.assign[zi], done:false, prompt: c.prompt ? JOURNAL_PROMPTS[Math.floor(Math.random()*JOURNAL_PROMPTS.length)] : null,
    t: c.min ? {total:c.min*SECS_PER_MIN, remaining:c.min*SECS_PER_MIN, running:false, endAt:0, finished:false} : null};
  S.won.push(item); save(); renderList();

/* ---------------- update ---------------- */
let tickAcc = 0;
function update(dt){
  time += dt;
  if(!joy.dragging) joy.jx *= Math.pow(.0005, dt);
  if(Math.abs(joy.jx) < .01 && !joy.dragging) joy.jx = 0;
  if(flash > 0) flash = Math.max(0, flash - dt*2.2);

  if(claw.phase === 'idle'){
    claw.closed += (.05 - claw.closed) * Math.min(1, dt*8);
    if(S.credit && Math.abs(joy.jx) > .15){
      const v = Math.sign(joy.jx) * (Math.abs(joy.jx)-.15)/.85 * 330;
      claw.x = Math.max(X_MIN, Math.min(X_MAX, claw.x + v*dt));
      tickAcc += dt; if(tickAcc > .09){ tickAcc = 0; sfx.tick(); }
    }
    claw.rot += (0 - claw.rot) * Math.min(1, dt*6);
  } else {
    const z = ZONES[claw.zone], targetHy = z.top + 40 - 130;
    if(claw.phase === 'down'){
      claw.closed += (0 - claw.closed) * Math.min(1, dt*10);
      const d = targetHy - claw.hy, step = Math.max(120, Math.min(480, d*3)) * dt;
      claw.hy = Math.min(targetHy, claw.hy + step);
      if(claw.hy >= targetHy - .5){ claw.hy = targetHy; claw.phase = 'grab'; claw.t = 0; }
    } else if(claw.phase === 'grab'){
      claw.t += dt;
      if(claw.t > .3){ const k = Math.min(1, (claw.t-.3)/.5); claw.closed = k*k*(3-2*k); if(k > .55 && !claw.carry){ claw.carry = z.type; sfx.grab(); burst(claw.x, z.top+30, 8, false); } }
      if(claw.t > 1.0){ claw.phase = 'up'; claw.t = 0; }
    } else if(claw.phase === 'up'){
      claw.t += dt;
      claw.hy = Math.max(HOME_HY, claw.hy - Math.min(430, 110 + claw.t*450) * dt);
      claw.rot = Math.min(1, (claw.hy-HOME_HY)/90);
      if(claw.hy <= HOME_HY + .5){ claw.hy = HOME_HY; claw.phase = 'present'; claw.t = 0; sfx.win(); burst(claw.x, 520, 26, true); }
    } else if(claw.phase === 'present'){
      claw.t += dt; claw.rot += (0 - claw.rot) * Math.min(1, dt*5);
      if(claw.t > .9) finishCatch();
    }
  }
  for(let i = parts.length-1; i >= 0; i--){ const p = parts[i]; p.age += dt; if(p.age > p.life){ parts.splice(i,1); continue; } p.vy += 220*SC*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
}

const C = {ol:'#55559a', head:'#8fa5e7', headHi:'#b8c8f7', headLo:'#6c83cf', arm:'#aeb9ec', armOl:'#5d5ca0', carr:'#adb6e6', carrHi:'#d0d7f5', carrLo:'#8f97d1', carrOl:'#7a73a6',

/* ---------------- pointer input ---------------- */
const loc = e => { const r = machine.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H}; };
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const overStick = p => dist(p, {x:760,y:1150}) < 115;
const overBtn = p => dist(p, BTN) < 88;
const overSlot = p => p.x > 190 && p.x < 550 && p.y > 1135 && p.y < 1290;
let lastNoCredit = 0;
machine.addEventListener('pointerdown', e => {
  ac(); const p = loc(e);
  if(overStick(p)){
    joy.dragging = true; machine.setPointerCapture(e.pointerId); moveStick(p);
    if(!S.credit && claw.phase==='idle' && Date.now()-lastNoCredit > 2500){ lastNoCredit = Date.now(); toast(S.coins>0 ? 'Insert a coin to move the claw! 🪙' : 'No coins left today 🌙'); }
  } else if(overBtn(p)){ joy.pressed = true; machine.setPointerCapture(e.pointerId); }
  else if(overSlot(p)) insertCoin();
});
function moveStick(p){ joy.jx = Math.max(-1, Math.min(1, (p.x - PIVOT.x)/85)); }
machine.addEventListener('pointermove', e => {
  const p = loc(e);
  if(joy.dragging) moveStick(p);
  else machine.style.cursor = (overStick(p) ? 'grab' : (overBtn(p) || overSlot(p)) ? 'pointer' : 'default');
});
const release = e => {
  const p = loc(e);
  if(joy.pressed){ joy.pressed = false; if(overBtn(p)) pressButton(); }
  joy.dragging = false;
};
machine.addEventListener('pointerup', release);
machine.addEventListener('pointercancel', () => { joy.dragging = false; joy.pressed = false; });

/* ---------------- sidebar / UI ---------------- */
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chText = w => { const c = CHALLENGES[w.cid]; return c.prompt ? `${c.text}: ${w.prompt}` : c.text; };

function renderTray(){
  const tray = $('#tray'); tray.innerHTML = '';
  for(let i=0;i<START_COINS;i++){ const d = document.createElement('div'); d.className = 'coin' + (i >= S.coins ? ' spent' : ''); d.textContent = '1'; tray.appendChild(d); }
  $('#coinCount').textContent = `${S.coins} left`;
}
function statusFor(w){
  if(w.done) return '✓ Done';
  if(w.t){ if(w.t.finished) return "⏰ Time's up! Tap to finish"; if(w.t.running) return '⏱ ' + fmt(w.t.remaining) + ' left'; if(w.t.remaining < w.t.total) return '⏸ Paused ' + fmt(w.t.remaining); return '⏱ ' + Math.round(w.t.total/SECS_PER_MIN) + ' min timer'; }
  return 'Tap to open';
}
function renderList(){
  const list = $('#list'); list.innerHTML = '';
  if(!S.won.length){ list.innerHTML = '<div class="empty">Nothing yet. Insert a coin and catch a plushie! 🧸</div>'; }
  S.won.forEach((w,i) => {
    const b = document.createElement('button'); b.className = 'catch' + (w.done ? ' done' : ''); b.dataset.i = i;
    const c = CHALLENGES[w.cid];
    b.innerHTML = `<img alt="" src="${plushURL(ZONES[w.zone].type)}"><div><div class="t">${c.emoji} ${esc(chText(w))}</div><div class="s" data-st>${esc(statusFor(w))}</div></div>`;
    b.addEventListener('click', () => openModal(i)); list.appendChild(b);
  });
  $('#doneCount').textContent = S.won.length ? `${S.won.filter(w=>w.done).length}/${S.won.length} done` : '';
}
function setStatus(){
  let msg;
  if(claw.phase !== 'idle') msg = 'Here goes… 🤞';
  else if(inserting) msg = 'Clink! 🪙';
  else if(S.credit) msg = 'Drag the joystick left or right to line up a plushie, then press the red button!';
  else if(S.coins > 0) msg = `Click the coin slot to insert a coin (${S.coins} left today).`;
  else msg = S.won.every(w=>w.done) ? 'All coins used and all challenges done. Amazing! 🌟' : 'Out of coins for today. Finish your challenges! 🌙';
  $('#status').textContent = msg;
}

/* ---------------- challenge modal ---------------- */
const modal = $('#modal'), sheet = $('#sheet');
const lockedNow = w => !!(w && w.t && !w.done && (w.t.running || w.t.finished || w.t.remaining < w.t.total));  // timer started or finished: only Done leaves
function openModal(i){ openIdx = i; renderModal(); modal.classList.add('open'); }
function closeModal(){ modal.classList.remove('open'); openIdx = -1; renderList(); setStatus(); }
function renderModal(){
  const w = S.won[openIdx]; if(!w) return;
  const z = ZONES[w.zone], c = CHALLENGES[w.cid];
  let timerHTML = '';
  if(w.t && !w.done){
    timerHTML = `<div class="ringwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#ffe0e8" stroke-width="11"/><circle id="ringFg" cx="60" cy="60" r="52" fill="none" stroke="#ff7fa3" stroke-width="11" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0"/></svg><div class="tm" id="tmTxt">${fmt(w.t.remaining)}</div></div>`;
  }
  const canDone = w.done || !w.t || w.t.finished;
  const locked = lockedNow(w);
  let timerBtn = '';
  if(w.t && !w.done && !w.t.finished) timerBtn = `<button class="btn" id="tBtn">${w.t.running ? 'Pause' : (w.t.remaining < w.t.total ? 'Resume' : 'Start timer')}</button>`;
  sheet.innerHTML = `
    <canvas class="pl" id="plc" width="260" height="260"></canvas>
    <div class="kick">${w.done ? 'Completed 🎉' : 'You caught ' + esc(z.name) + '!'}</div>
    <div class="ch">${c.emoji} ${esc(chText(w))}</div>
    <div class="sub" id="sub">${w.t ? (w.t.finished && !w.done ? "Time's up! Tap Done when you're finished." : (w.done ? '' : 'Press Start when you begin. Done unlocks when the timer ends.')) : (w.done ? '' : 'Tap Done when you\'ve finished.')}</div>
    ${timerHTML}
    <div class="row">${timerBtn}</div>
    <div class="row">
      ${locked ? '' : `<button class="btn alt" id="laterBtn">${w.done ? 'Close' : 'Do it later'}</button>`}
      ${w.done ? '' : `<button class="btn good" id="doneBtn" ${canDone ? '' : 'disabled'}>Done ✓</button>`}
    </div>`;
  const pc = $('#plc').getContext('2d'); pc.imageSmoothingEnabled = false; pc.drawImage(sprite(z.type), 0, 0, SPR_N, SPR_N, 10, 10, 240, 240);
  if($('#laterBtn')) $('#laterBtn').onclick = closeModal;
  const db = $('#doneBtn'); if(db) db.onclick = () => { w.done = true; if(w.t){ w.t.running = false; } save(); sfx.done(); burst(190, 200, 40, true); closeModal(); toast('Challenge complete! 🎉'); };
  const tb = $('#tBtn'); if(tb) tb.onclick = () => {
    ac();
    if(w.t.running){ w.t.remaining = Math.max(1, Math.ceil((w.t.endAt - Date.now())/1000)); w.t.running = false; }
    else { w.t.endAt = Date.now() + w.t.remaining*1000; w.t.running = true; }
    save(); renderModal(); renderList();
  };
  updateTimerUI();
}
function updateTimerUI(){
  if(openIdx < 0) return; const w = S.won[openIdx]; if(!w || !w.t) return;
  const tx = $('#tmTxt'), rg = $('#ringFg'); if(tx) tx.textContent = fmt(w.t.remaining);
  if(rg) rg.setAttribute('stroke-dashoffset', String(326.7 * (1 - w.t.remaining / w.t.total)));
}
addEventListener('keydown', e => { if(e.key === 'Escape' && openIdx >= 0 && !lockedNow(S.won[openIdx])) closeModal(); });
modal.addEventListener('pointerdown', e => { if(e.target === modal && !lockedNow(S.won[openIdx])) closeModal(); });

/* ---------------- timers ---------------- */
function tickTimers(){
  let changed = false, running = null;
  S.won.forEach((w,i) => {
    if(!w.t || !w.t.running) return;
    const rem = Math.ceil((w.t.endAt - Date.now())/1000);
    if(rem <= 0){
      w.t.remaining = 0; w.t.running = false; w.t.finished = true; changed = true;
      sfx.chime(); toast(`⏰ Time's up: ${CHALLENGES[w.cid].text}`);
      if(openIdx === i) renderModal();
    } else { w.t.remaining = rem; running = w; }
  });
  if(changed) save();
  // update list statuses
  document.querySelectorAll('#list .catch').forEach(b => { const w = S.won[+b.dataset.i]; const s = b.querySelector('[data-st]'); if(w && s){ const t = statusFor(w); if(s.textContent !== t) s.textContent = t; } });
  updateTimerUI();
  const rem = S.won.filter(w => w.t && w.t.running);
  document.title = rem.length ? `⏱ ${fmt(Math.min(...rem.map(w=>w.t.remaining)))} · Catch Challenge` : 'Catch Challenge';
}
setInterval(tickTimers, 250);

/* ---------------- toggles + reset ---------------- */
function syncToggles(){ $('#tgSound').classList.toggle('on', prefs.sound); $('#tgSound').textContent = prefs.sound ? '🔊 Sound on' : '🔇 Sound off'; }
$('#tgSound').onclick = () => { prefs.sound = !prefs.sound; savePrefs(); syncToggles(); if(prefs.sound){ ac(); sfx.tick(); } };
let resetArm = 0;
$('#reset').onclick = e => {
  if(Date.now() - resetArm > 3000){ resetArm = Date.now(); e.target.textContent = 'Tap again to confirm'; setTimeout(()=>{ e.target.textContent = 'Start a fresh day (resets coins and catches)'; }, 3000); return; }
  S = newDay(String(Date.now())); save(); claw.x = 190; claw.hy = HOME_HY; claw.phase = 'idle'; claw.carry = null;
  e.target.textContent = 'Start a fresh day (resets coins and catches)'; renderTray(); renderList(); setStatus(); toast('Fresh day! 5 new coins 🪙');
};

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now){ const dt = Math.min(.05, (now-last)/1000); last = now; update(dt); draw(); requestAnimationFrame(frame); }

layout(); syncToggles(); renderTray(); renderList(); setStatus();
requestAnimationFrame(frame);
window.LC = {S:()=>S, claw, joy, insertCoin, pressButton, openModal, ZONES, sprite, SPR_N};   // handy for testing
})();
</script>
</body>
</html>
